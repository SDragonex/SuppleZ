<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SuppleZ</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#00f3ff" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063212.png" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
:root {
    --bg-color: #000000;
    --card-bg: #0a0a0a;
    --input-bg: #111;
    --text-main: #e0e0e0;
    --text-dim: #888;
    --neon-green: #00ff41;
    --neon-yellow: #ffea00;
    --neon-red: #ff003c;
    --ui-accent: #00f3ff;
    --nav-height: 65px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: "Roboto", sans-serif;
    padding-bottom: calc(var(--nav-height) + 20px);
}

header {
    background: rgba(0, 0, 0, 0.9);
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(5px);
}

.logo {
    font-family: "Rajdhani", sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
}

.highlight {
    color: var(--ui-accent);
    text-shadow: 0 0 10px var(--ui-accent);
}

.section-title {
    font-family: "Rajdhani", sans-serif;
    margin-bottom: 15px;
    color: var(--ui-accent);
    border-left: 3px solid var(--ui-accent);
    padding-left: 10px;
}

input, textarea, select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid #333;
    color: #fff;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    font-family: inherit;
    outline: none;
}

input:focus, textarea:focus, select:focus {
    border-color: var(--ui-accent);
}

.row {
    display: flex;
    gap: 10px;
}

.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    padding-bottom: 20px;
}

@keyframes slideUpFade {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card {
    background: rgba(15, 15, 15, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    opacity: 0;
    animation: slideUpFade 0.5s forwards;
}

.card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(25, 25, 25, 0.8);
}

.card.green:hover {
    box-shadow: 0 10px 30px -10px rgba(0, 255, 65, 0.3);
    border-top: 1px solid var(--neon-green);
}

.card.yellow:hover {
    box-shadow: 0 10px 30px -10px rgba(255, 234, 0, 0.3);
    border-top: 1px solid var(--neon-yellow);
}

.card.red:hover {
    box-shadow: 0 10px 30px -10px rgba(255, 0, 60, 0.3);
    border-top: 1px solid var(--neon-red);
}

.card::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    opacity: 0.7;
}

.card.green::after {
    background: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
}

.card.yellow::after {
    background: var(--neon-yellow);
    box-shadow: 0 0 10px var(--neon-yellow);
}

.card.red::after {
    background: var(--neon-red);
    box-shadow: 0 0 10px var(--neon-red);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
}

.card-rating {
    font-size: 0.85rem;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(5px);
    border: 1px solid #333;
}

.card h3 {
    font-family: "Rajdhani", sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
    line-height: 1.2;
}

.card-category {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #aaa;
    margin-bottom: 8px;
    display: block;
}

.card-desc {
    font-size: 0.85rem;
    color: #888;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.diary-input-box {
    background: #080808;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #222;
    margin-bottom: 20px;
}

.diary-buttons {
    display: flex;
    gap: 10px;
    margin-top: 5px;
}

.diary-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 0.8rem;
}

.btn-green {
    background: var(--neon-green);
    box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
}

.btn-yellow {
    background: var(--neon-yellow);
    box-shadow: 0 0 10px rgba(255, 234, 0, 0.2);
}

.btn-red {
    background: var(--neon-red);
    box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
}

.filter-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    color: #888;
    font-size: 0.9rem;
}

.filter-box select {
    margin-bottom: 0;
    padding: 8px;
    width: auto;
    flex: 1;
}

.diary-entry {
    background: #0f0f0f;
    border-left: 4px solid #555;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 0 8px 8px 0;
    position: relative;
}

.diary-entry.green {
    border-left-color: var(--neon-green);
}

.diary-entry.yellow {
    border-left-color: var(--neon-yellow);
}

.diary-entry.red {
    border-left-color: var(--neon-red);
}

.entry-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 5px;
}

.entry-name {
    font-weight: bold;
    font-size: 1.1rem;
    color: #fff;
}

.entry-cycle {
    font-size: 0.7rem;
    background: #222;
    padding: 2px 6px;
    border-radius: 4px;
    color: #aaa;
    text-transform: uppercase;
    margin-left: 5px;
}

.entry-meta {
    font-size: 0.75rem;
    color: #666;
}

.entry-note {
    font-style: italic;
    color: #ccc;
    margin-top: 5px;
    font-size: 0.9rem;
}
